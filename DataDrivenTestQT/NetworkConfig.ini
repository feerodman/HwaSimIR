[Identity]
platID=1001
sensorID=2

[RenderControl]
simMode=1
videoFps=60
sendStepMs=16.666666666666668

[UDP]
localIp=192.168.1.188
localPort=9998
remoteIp=192.168.1.116
remotePort=8888

[DdsProtocol]
DomainId=150
QosFile=Config/DDS/ZRDDS_PROTOCOL_QOS.xml
TopicControl=HwaSimIR.Control
TopicInit=HwaSimIR.Init
TopicRealtime=HwaSimIR.Realtime
TopicInitAck=HwaSimIR.InitAck


[Demo]
; P14 ordinary DDS default: the immutable original trajectory.  The short
; ordinary_demo_1km.txt remains a diagnostic asset and is never substituted
; for this production default.
InputFile=1.txt
TargetType=0x22
envSky=1
; Same deterministic date used by the renderer fallback.  Source Time(ms) is
; added to this epoch; send wall time and video PTS remain separate clocks.
UtcDate=2026-09-06
UtcHour=3.5

[WeatherInit]
; Real protocol values.  Each run is rejected unless every current input row
; can be queried inside the bound formal LUT; no range clamp or missing fill.
envVisibility=6000
envHumidity=85

[Atmosphere]
FormalLut=Config/Atmosphere/MODTRAN/processed/band_lut_si.csv
CoverageManifest=Config/Atmosphere/MODTRAN/processed/p14_coverage_manifest.json
ExpectedFormalLutSha256=48432459ac56dbb6980f3ca25e2d1e4701763ba3674703051cb0fd45da8c7cd7
ExpectedCoverageManifestSha256=f5d27c304b663218b94c9e45bd2bbbb968de1a66695f551ba5c4633f9c4c5d7b

[SensorInit]
trackerSensorBand=2
trackerSensorWidth=800
trackerSensorHeight=800
realtimeAnnotation=1
saveMP4En=1
h264En=1
