; 华算红外运行时配置
; 当前配置适用于 RK3588 板卡无窗口运行，并保留 TCP 视频、标注和实时数据输出。
; 配置优先级：环境变量高于本文件，本文件高于程序默认值。
; 配置段名、配置键名和固定枚举值由程序定义，请勿翻译或随意改写。

; =============================================================================
; 一、帧调度与渲染宿主
; =============================================================================

[RenderControl]
; 模式来源策略。ExternalPreferred 表示优先采用合法的初始化包参数；ConfigOnly 表示只用本地配置。
ModePolicy=ExternalPreferred
; 本地仿真模式。1 表示同步模式，一包有效输入对应一帧；2 表示异步模式，按帧率使用最新状态。
ConfiguredSimMode=2
; 本地配置的视频帧率，仅在本地模式生效或外部帧率无效时作为回退值。
ConfiguredVideoFps=60
; 实时运行允许的最低帧率。
MinRealtimeFps=60
; 是否强制实时帧率不低于最低帧率。
EnforceMinRealtimeFps=true
; 异步输入策略。Latest 表示始终使用最新输入状态，旧状态可以被覆盖。
AsyncInputPolicy=Latest

[RenderBackend]
; 渲染宿主模式。HeadlessOffscreen 表示无窗口离屏渲染；VisibleWindow 表示创建可见窗口。
PresentationMode=HeadlessOffscreen
; 是否显示窗口预览。板卡无窗口运行应关闭。
WindowPreview=false
; 是否显示 Panda3D 帧率浮层。板卡无窗口运行应关闭。
EnableFrameRateMeter=false
; 无窗口离屏缓冲区宽度，必须与当前输出分辨率保持一致。
HeadlessWidth=800
; 无窗口离屏缓冲区高度，必须与当前输出分辨率保持一致。
HeadlessHeight=800
; 无窗口模式下，在最终后处理无需额外处理时是否直接渲染到最终传感器纹理。
HeadlessFastDirectFinal=true
; 是否启用无窗口图像黑帧、均值、最大值和非黑比例诊断。
HeadlessImageProbe=false
; 是否启用渲染阶段细分耗时诊断。
RenderPerfProbe=false
; 无窗口模式下是否强制关闭垂直同步，避免离屏渲染被显示刷新率限制。
HeadlessForceSyncVideoFalse=true
; 无窗口读回策略。EveryFrame 表示每帧读回；DisabledForPerfProbe 只用于性能诊断且不会发送新图像；EveryN 表示每隔若干帧读回。
HeadlessReadbackMode=EveryFrame
; 当读回策略为 EveryN 时的帧间隔；EveryFrame 模式下保持为 1。
HeadlessReadbackEveryN=1

[Performance]
; 是否输出低频性能汇总日志。
EnablePerfLog=0
; 是否输出逐帧红外详细日志，实时运行建议关闭。
EnableIRVerboseLog=0
; 红外物理和场景状态更新频率，单位为赫兹。
IRUpdateHz=30
; 是否抑制高频诊断日志，以减少板卡实时运行时的日志开销。
QuietPerfMode=false
; 是否跳过不可见或超过远裁剪面的目标更新；关闭可保持既有生产行为。
TargetUpdateCullInvisible=false

; =============================================================================
; 二、红外物理与目标热特征
; =============================================================================

[Stage3]
; 是否输出 MODTRAN 大气透过率对比诊断日志。
EnableModtranTauDebug=0
; 是否把 MODTRAN 透过率实际应用到大气透过链路；关闭时保持原有透过率来源。
UseModtranTauForAtmosphere=0

[Stage4]
; 是否启用热斑和亮斑可视化诊断。
EnableHotspotVisualDebug=0
; 是否强制显示目标头部或中部亮斑，仅用于诊断。
ForceBrightSpotVisible=0
; 是否强制显示目标尾部热斑，仅用于诊断。
ForceRearHotspotVisible=0
; 是否允许发动机状态加热整个目标机体；关闭可保持发动机热源只作用于尾部热斑和羽流。
LegacyEngineBodyHeating=false
; 热斑、亮斑及相关目标状态的更新频率，单位为赫兹。
Stage4UpdateHz=30

[Stage5]
; 是否启用辐射分量调试合成显示；关闭时保持正式输出路径。
EnableRadianceDebug=0
; 辐射调试视图。Composite 为合成结果，BodyOnly 为机体，HotspotOnly 为热斑，BrightSpotOnly 为亮斑。
DebugViewMode=Composite
; 调试亮度映射方式。可选 linear、log、asinh。
DebugToneMap=asinh

[Stage5Radiance]
; 是否计算红外物理辐射链路。
EnableIRPhysicalPipeline=true
; 正式辐射调试视图。Off 表示不改变主画面，其余值用于分量诊断。
DebugView=Off
; 是否周期输出各辐射分量日志。
LogComponents=false
; 辐射分量日志的帧间隔。
ComponentLogEveryFrames=120
; 是否使用传感器输入值直接驱动调试显示。
UseSensorInputForDisplay=false
; 传感器输入显示映射模式。Manual 表示使用下方手动缩放、偏置和截断参数。
SensorInputDisplayMode=Manual
; 传感器输入显示缩放系数。
SensorInputDisplayScale=1.0
; 传感器输入显示偏置。
SensorInputDisplayOffset=0.0
; 传感器输入映射后的最小截断值。
SensorInputDisplayClampMin=0.0
; 传感器输入映射后的最大截断值。
SensorInputDisplayClampMax=1.0
; 传感器输入显示伽马值。
SensorInputDisplayGamma=1.0
; 传感器输入显示所使用的波段。当前配置为中波红外。
SensorInputDisplayBand=MWIR

[Stage5AeroThermal]
; 是否计算气动加热模型。
EnableAeroThermalModel=true
; 是否把气动加热结果真正叠加到辐射输出；关闭时只计算和诊断。
ApplyAeroToRadiance=false
; 是否输出气动加热详细日志。
AeroDebugLog=false
; 气动加热日志的帧间隔。
AeroLogEveryFrames=120
; 恢复温度计算使用的恢复系数。
RecoveryFactor=0.85
; 气体比热比。
Gamma=1.4
; 机体区域气动加热系数。
BodyCoeff=0.20
; 机鼻区域气动加热系数。
NoseCoeff=0.60
; 边缘区域气动加热系数。
EdgeCoeff=0.45
; 后部区域气动加热系数。
RearCoeff=0.10
; 升温惯性时间常数，单位为秒。
HeatTauSec=2.0
; 降温惯性时间常数，单位为秒。
CoolTauSec=5.0
; 参与计算的最低马赫数限制。
ClampMachMin=0.0
; 参与计算的最高马赫数限制。
ClampMachMax=4.0
; 气动加热温升的最大限制，单位为开尔文。
ClampDeltaKMax=250.0
; 气动加热叠加到辐射链路时的缩放系数。
AeroApplyScale=0.25
; 气动加热叠加到机体温升时的最大限制，单位为开尔文。
AeroApplyClampBodyDeltaK=40.0
; 气动加热只允许作用的波段。当前配置为中波红外。
AeroApplyOnlyBand=MWIR

[Stage5ModtranRadiance]
; 是否启用 MODTRAN 辐射数据诊断。
EnableModtranRadianceDebug=false
; 是否把 MODTRAN 路径辐射接入实时图像链路。
UseModtranPathRuntime=false
; 是否把 MODTRAN 天空辐射接入实时图像链路。
UseModtranSkyRuntime=false
; 是否把 MODTRAN 太阳辐射接入实时图像链路。
UseModtranSolarRuntime=false
; MODTRAN 路径辐射实时应用的波段。当前配置为中波红外。
ModtranPathRuntimeBand=MWIR
; MODTRAN 路径辐射实时应用方式。Off 表示不应用。
ModtranPathRuntimeMode=Off
; MODTRAN 路径辐射的单位处理方式。Native 表示保持数据原始单位。
ModtranPathUnitMode=Native
; MODTRAN 路径辐射缩放系数。
ModtranPathScale=1.0
; MODTRAN 路径辐射偏置。
ModtranPathOffset=0.0
; MODTRAN 路径辐射最小截断值。
ModtranPathClampMin=0.0
; MODTRAN 路径辐射最大截断值。
ModtranPathClampMax=10.0
; MODTRAN 路径辐射与原路径结果的混合比例。
ModtranPathBlend=1.0
; 是否输出 MODTRAN 路径辐射应用前后的对比日志。
ModtranPathABLog=true
; MODTRAN 辐射数据的优先来源。band_lut 表示按波段查表。
PreferredSource=band_lut
; MODTRAN 辐射诊断日志的帧间隔。
LogEveryFrames=120
; 是否与旧辐射结果进行对比。
CompareLegacy=false

[Stage5Plume]
; 发动机羽流状态更新频率，单位为赫兹。
UpdateHz=30
; 发动机羽流每次更新的性能预算，单位为毫秒。
PerfBudgetMs=1.0
; 是否启用独立的发动机尾部羽流。
EnableEnginePlume=1
; 发动机羽流参数文件路径。
EnginePlumeProfilePath=Config/IRPlume/engine_plume_profiles.json
; 场景中允许同时存在的羽流节点上限。
MaxPlumeNodes=16
; 是否使用协议中的发动机状态控制羽流。
UseEngineState=1
; 是否给羽流叠加程序化扰动。
UseProceduralNoise=1
; 是否启用羽流诊断模式。
EnablePlumeDebug=0
; 是否无视发动机状态强制显示羽流，仅用于诊断。
ForcePlumeVisible=0
; 羽流整体显示增益。
PlumeDisplayGain=1.5
; 羽流核心显示增益。
PlumeCoreDisplayGain=1.8
; 羽流光晕显示增益。
PlumeHaloDisplayGain=1.0
; 羽流整体透明度缩放系数。
PlumeOpacityScale=1.0
; 羽流核心透明度缩放系数。
PlumeCoreOpacityScale=1.1
; 羽流光晕透明度缩放系数。
PlumeHaloOpacityScale=0.9

; =============================================================================
; 三、传感器后处理与最终图像
; =============================================================================

[Stage6Display]
; 极性设置。1 为白热，0 为黑热。
WhiteHot=1
; 最终显示层的手动增益。
DisplayGain=1.0
; 最终显示层的手动偏置，单位为灰度值。
DisplayOffset=0.0
; 是否把最终显示层处理应用到预览画面；无窗口模式下仍保持最终输出链路一致。
ApplyToWindow=1
; 是否让天空和地面背景进入最终显示层处理。
BackgroundDisplayEnable=1
; 是否由本文件的噪声参数覆盖协议中的噪声参数。
NoiseOverrideEnable=1
; 是否启用轻量显示噪声。
NoiseEnable=0
; 轻量显示噪声的标准差，单位为灰度值。
NoiseSigmaGray=0.0

[Stage6MTF]
; 是否启用调制传递函数近似模糊。
EnableMTFBlur=false
; 模糊算法。GaussianSeparable 表示可分离高斯模糊。
MTFBlurMode=GaussianSeparable
; 高斯模糊标准差，单位为像素。
MTFBlurSigmaPixels=0.65
; 高斯模糊核半径，单位为像素。
MTFBlurRadiusPixels=2
; 高斯模糊执行次数。
MTFBlurPasses=1
; 模糊作用位置。final_display 表示作用于最终显示结果。
MTFApplyTo=final_display
; 是否输出调制传递函数模糊诊断日志。
MTFDebugLog=false
; 调制传递函数诊断日志的帧间隔。
MTFLogEveryFrames=120

[Stage6DetectorNoise]
; 是否启用探测器噪声模型。
EnableDetectorNoise=false
; 探测器噪声作用位置。final_display 表示作用于最终显示结果。
NoiseApplyTo=final_display
; 探测器噪声与自动增益控制的先后顺序。BeforeAGC 表示先加噪声再做自动增益。
NoisePosition=BeforeAGC
; 是否启用逐帧变化的随机噪声。
EnableTemporalNoise=true
; 随机噪声标准差，使用归一化灰度单位。
TemporalNoiseSigmaGray=0.005
; 是否启用固定图样噪声。
EnableFPN=false
; 固定图样噪声标准差，使用归一化灰度单位。
FPNSigmaGray=0.003
; 固定图样噪声的随机种子，固定值可保证结果可重复。
FPNSeed=12345
; 是否启用列噪声。
EnableColumnNoise=false
; 列噪声标准差，使用归一化灰度单位。
ColumnNoiseSigmaGray=0.002
; 是否启用行噪声。
EnableRowNoise=false
; 行噪声标准差，使用归一化灰度单位。
RowNoiseSigmaGray=0.001
; 是否启用坏点模型。
EnableBadPixels=false
; 坏点占全部像素的比例。
BadPixelRatio=0.0001
; 热坏点的归一化灰度值。
BadPixelHotGray=1.0
; 死坏点的归一化灰度值。
BadPixelDeadGray=0.0
; 加噪后允许的最小归一化灰度值。
NoiseClampMin=0.0
; 加噪后允许的最大归一化灰度值。
NoiseClampMax=1.0
; 是否输出探测器噪声诊断日志。
NoiseDebugLog=false
; 探测器噪声诊断日志的帧间隔。
NoiseLogEveryFrames=120

[Stage6AGC]
; 是否启用自动增益控制。
EnableAGC=false
; 自动增益统计方式。Percentile 表示使用灰度百分位；MeanStd 表示使用均值和标准差。
AGCMode=Percentile
; 自动增益作用位置。final_display 表示作用于最终显示结果。
AGCApplyTo=final_display
; 自动增益统计数据来源。previous_readback 表示使用上一帧读回结果。
AGCStatsSource=previous_readback
; 自动增益参数更新频率，单位为赫兹。
AGCUpdateHz=30
; 自动增益诊断日志的帧间隔。
AGCLogEveryFrames=120
; 百分位模式使用的低端百分位。
AGCLowPercentile=2.0
; 百分位模式使用的高端百分位。
AGCHighPercentile=98.0
; 均值标准差模式使用的标准差倍数。
AGCMeanStdK=2.5
; 自动增益允许的最小增益。
AGCMinGain=0.25
; 自动增益允许的最大增益。
AGCMaxGain=8.0
; 自动增益允许的最小偏置。
AGCMinOffset=-1.0
; 自动增益允许的最大偏置。
AGCMaxOffset=1.0
; 自动增益平滑系数，越大表示对新统计结果响应越快。
AGCSmoothingAlpha=0.15
; 自动增益映射后的目标低灰度值。
AGCTargetLowGray=0.05
; 自动增益映射后的目标高灰度值。
AGCTargetHighGray=0.95
; 自动增益统计的像素采样步长。
AGCStride=8
; 自动增益统计时是否排除标注覆盖层。
AGCExcludeAnnotationOverlay=true
; 是否输出自动增益诊断日志。
AGCDebugLog=false

[Stage6Capture]
; 是否在渲染着色阶段进行垂直翻转。
FlipInShader=false
; 是否在 TCP 图像读回线程中进行垂直翻转；当前值保持既有图像方向。
FlipInTcpThread=true

; =============================================================================
; 四、背景与天气显示
; =============================================================================

[Stage7Background]
; 是否启用天空和地面背景。
EnableSkyHorizon=1
; 背景诊断模式。Off 为正常显示，SkyOnly 只显示天空，GroundOnly 只显示地面，SkyGroundColor 使用固定诊断灰度。
DebugMode=Off
; 地面或海面参考高度偏移。
GroundZOffset=0.0
; 是否使用三维天空穹顶和下半球背景。
UseReal3DBackground=1
; 背景状态更新频率，单位为赫兹。
Stage7UpdateHz=10

[Stage7Weather]
; 是否启用天气显示效果总开关。
EnableWeatherEffects=1
; 天气参数文件路径。
WeatherProfilePath=Config/Weather/weather_profiles.json
; 天气纹理索引文件路径。
WeatherTextureConfig=Config/Weather/weather_textures.json
; 是否启用云层显示。
EnableCloudLayer=1
; 云渲染方式：World2D 为单层世界平面；Layered2_5D 为两到三层世界切片；StreamedWorld3D 为远场切片加目标附近世界网格体积云。
CloudRenderMode=Layered2_5D
; 世界云层切片数量；World2D 固定使用一层，Layered2_5D 限制为二至三层。
CloudLayerCount=3
; 云天气状态的 CPU 更新频率，单位为赫兹；UV 动画由着色器时间驱动。
CloudUpdateHz=10
; 云底相对 Stage7 地面参考高度，单位为米。
CloudBaseAltitudeM=2500
; 多层云从云底到云顶的总厚度，单位为米。
CloudThicknessM=800
; 围绕相机按固定世界网格重排的云层总边长，单位为米；纹理坐标不随重排滑动。
CloudWorldSizeM=30000
; 世界网格吸附和纹理基础尺度，单位为米。
CloudTileSizeM=5000
; 云纹理世界坐标风移速度的统一倍率。
CloudUvSpeedScale=1.0
; 天气 profile 中云光学厚度的统一倍率。
CloudOpticalDepthScale=1.0
; 云密度阈值边缘的柔化宽度。
CloudEdgeSoftness=0.15
; 细节纹理相对基础纹理的采样倍率。
CloudDetailScale=3.0
; 细节纹理参与云密度计算的权重。
CloudDetailStrength=0.35

; 是否启用雾或霾的近似混合。
EnableFog=1
; 是否启用雨雪粒子显示。
EnablePrecipitation=0
; 雨雪显示方式。ScreenOverlay 表示使用屏幕覆盖层。
Stage7PrecipitationMode=ScreenOverlay
; 雨雪粒子数量上限；0 表示不创建雨雪粒子。
PrecipitationMaxParticles=0
; 是否使用初始化包中的天空、能见度、湿度、风和温度数据驱动天气。
UseWeatherUdpInput=1

[Stage7VolumetricCloud]
; 是否启用流式世界空间体积云；关闭时完全保持 W1 云层基线。
Enable=false
; 流式中心；当前只支持按协议完整目标键解析的跟踪目标。
StreamingCenter=TrackedTarget
; 确定性世界网格边长，单位为米。
CellSizeM=2500
; 云体进入对象池的半径，单位为米。
StreamingRadiusM=6000
; 云体离开对象池的半径，必须大于加载半径，单位为米。
DeactivationRadiusM=7500
; 对象池中最多保持的活动云体数量。
MaxActiveVolumes=8
; 同一帧最多参与绘制的云体数量；RK3588 建议一至二。
MaxVisibleVolumes=4
; 云体中心相对 Stage7 地面参考面的最低和最高高度，单位为米。
MinCloudAltitudeM=2200
MaxCloudAltitudeM=4200
; 云体水平半径范围，单位为米。
MinRadiusXYM=350
MaxRadiusXYM=1000
; 云体垂直半径范围，单位为米。
MinRadiusZM=180
MaxRadiusZM=500
; 无天气业务覆盖时的诊断默认概率；实际业务值由天气配置文件覆盖。
CloudProbability=0.35
; 确定性天气种子；同一网格、天气和种子始终生成同一云体。
WeatherSeed=12345
; 共享三维密度纹理边长；初始化后缓存，不逐云或逐帧生成。
DensityTextureSize=32
; 近、中、远距离的局部体积积分步数。
RaymarchStepsNear=10
RaymarchStepsMedium=7
RaymarchStepsFar=4
; 流式边界渐入渐出的距离，单位为米。
FadeDistanceM=800
; 是否启用距离、屏幕尺寸和视锥裁剪。
EnableDistanceLod=true
EnableScreenSizeLod=true
EnableFrustumCull=true

; =============================================================================
; 五、TCP 编码与分段传输
; =============================================================================

[TcpOutput]
; 视频编码类型。auto 表示根据初始化包请求选择 H.264 或 JPEG；jpeg 和 h264 可用于显式选择。
Codec=h264
; JPEG 编码质量，范围由 OpenCV 编码器约束，100 表示保持现有最高质量设置。
JpegQuality=100
; JPEG 编码颜色模式。rgb 表示彩色编码，gray 表示灰度编码。
JpegEncodeMode=rgb
; JPEG 灰度转换方法。luma 表示按亮度加权转换。
JpegGrayConvertMethod=luma
; 是否允许启用 H.264 编码链路。
EnableH264Experimental=true
; H.264 编码后端。auto 在 RK3588 上依次尝试 MPP、FFmpeg、JPEG 回退；也可显式填写 mpp、ffmpeg 或 jpeg。
H264Encoder=mpp
; H.264 目标码率，单位为千比特每秒。
H264BitrateKbps=4000
; H.264 关键帧间隔，单位为帧。
H264GopFrames=30
; 是否启用 H.264 低延迟设置并禁用双向预测帧。
H264LowLatency=true
; H.264 不可用或编码失败时是否允许回退到 JPEG。
H264FallbackToJpeg=false
; 编码器启动、初始化、复位或 TCP 重连后是否请求关键帧。
H264ForceKeyFrameOnStart=true
; 是否启用 JPEG 性能对比诊断。
JpegPerfABTest=false

[TcpPayload]
; TCP 帧包版本。3 表示使用可独立开关视频、标注和实时数据的分段格式。
PacketVersion=3
; 是否发送编码后的视频段；关闭后不会执行 JPEG 或 H.264 编码。
SendVideo=true
; 是否生成并发送标注数据段。
SendAnnotation=true
; 是否发送目标跟踪实时数据段。
SendRealtimeData=true
; 是否继续按既有格式转发初始化和控制数据。
ForwardInitControl=true

[DdsVideo]
Enable=false
Codec=auto
RawPixelFormat=gray8
DomainId=150
QosFile=Config/DDS/ZRDDS_PROTOCOL_QOS.xml
TopicH264Precise=HwaSimIR.Video.precise.H264
TopicRawGray8Precise=HwaSimIR.Video.precise.RawGray8
TopicRawBgr24Precise=HwaSimIR.Video.precise.RawBGR24
TopicH264Coarse=HwaSimIR.Video.coarse.H264
TopicRawGray8Coarse=HwaSimIR.Video.coarse.RawGray8
TopicRawBgr24Coarse=HwaSimIR.Video.coarse.RawBGR24
QueueMaxFrames=120
BlockWhenQueueFull=true
AckTimeoutSec=60
ShutdownDrainMs=5000
EnablePerfLog=true
AuditPath=
AuditMaxSamples=0

[CommandTransport]
; udp keeps the complete legacy chain, dds enables the typed DDS chain, both
; feeds both transports into the same business handlers with cross-transport deduplication.
Input=udp
Ack=match_input

[DdsProtocol]
Enable=false
DomainId=150
QosFile=Config/DDS/ZRDDS_PROTOCOL_QOS.xml
TopicControl=HwaSimIR.Control
TopicInit=HwaSimIR.Init
TopicRealtime=HwaSimIR.Realtime
TopicInitAck=HwaSimIR.InitAck
TopicVideoStatus=HwaSimIR.VideoStatus
DeduplicateWhenBoth=true
DeduplicateWindowMs=1000

[LocalRecording]
Enable=false
OutputDirectory=/home/linaro/HwaSimIR_Record
Container=mp4
FilePrefix=HwaSimIR
Encoder=auto
BitrateKbps=4000
GopFrames=30
QueueMaxFrames=120
BlockWhenQueueFull=true
FlushTimeoutMs=10000
EnablePerfLog=true

; =============================================================================
; 六、标注与进程控制
; =============================================================================

[Annotation]
; 是否把标注图形绘制到最终传感器图像中；关闭不影响标注数据发送。
OverlayInSensorImage=true
; 是否每帧生成标注数据。
JsonPerFrame=true
; 是否启用标注快速生成路径，复用低频几何计算结果。
FastJsonMode=false
; 快速路径中目标框的更新频率，单位为赫兹。
BBoxUpdateHz=10
; 快速路径中遮挡判断的更新频率，单位为赫兹。
OcclusionUpdateHz=5
; 跳过几何计算的帧是否复用最近一次有效标注。
ReuseLastWhenSkipped=true
; 常规标注几何更新频率，单位为赫兹；未更新的输出帧复用最近一次有效标注。
UpdateHz=10
; 标注模型参数文件路径。
ProfilePath=Config/Annotation/annotation_profiles.json
; 是否显示标注诊断覆盖层。
DebugOverlay=false
; 目标框计算方式。mesh_body 表示根据目标网格机体计算。
BBoxMode=mesh_body
; 目标框快速计算方式。mesh_body 保持原网格算法；cached_aabb_8corners 使用缓存包围盒八角点。
BBoxFastMode=mesh_body
; 目标框外扩边距，单位为像素。
BBoxMarginPx=3
; 允许输出的最小目标框尺寸，单位为像素。
MinBBoxSizePx=4
; 是否绘制关键点。
DrawKeyPoints=true
; 是否绘制模型标签文字。
DrawModelLabel=true
; 是否绘制目标框。
DrawBBox=true
; 是否启用目标遮挡判断。
OcclusionEnable=true
; 遮挡判断方式。mesh_collision 表示使用网格碰撞检测。
OcclusionMode=mesh_collision
; 遮挡距离判断容差，单位为米。
OcclusionEpsilonM=0.25
; 遮挡碰撞检测使用的掩码位。
OcclusionCollisionMaskBit=20
; 遮挡判断时是否允许目标自身参与遮挡。
OcclusionSelfTarget=false
; 是否启用表面关键点计算。
SurfaceKeyPointEnable=true
; 是否把关键点吸附到模型表面。
SurfaceSnapEnable=false
; 表面吸附方式。profile_surface 表示按标注参数中的表面定义处理。
SurfaceSnapMode=profile_surface

[Debug]
; 收到停止控制命令后是否退出进程。0 表示保持进程运行，1 表示退出。
ExitOnStop=0
