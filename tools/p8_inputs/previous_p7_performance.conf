; RK3588 HwaSim_IR production performance policy.
; P3 real-board search found that the 528 MHz DDR memory-controller floor was
; the actual bottleneck.  The minimum values below retain automatic governors
; while providing enough CPU and memory bandwidth for full MWIR Cloudy at 60 Hz.
; The GPU may remain at its lowest clock in this measured workload.
PolicyMode=auto_min
; Linux process scheduling priority for HwaSim_IR. Range -20 (highest) to 19.
ProcessNice=-20
CpuGovernor=ondemand
CpuPolicy0MinKHz=1200000
CpuPolicy0MaxKHz=1704000
CpuPolicy4MinKHz=1416000
CpuPolicy4MaxKHz=2016000
CpuPolicy6MinKHz=1416000
CpuPolicy6MaxKHz=2016000
GpuGovernor=simple_ondemand
GpuMinHz=300000000
GpuMaxHz=1000000000
DmcGovernor=dmc_ondemand
DmcMinHz=1068000000
DmcMaxHz=2112000000
; Restore the board's original ondemand/simple_ondemand policy on normal exit.
RestoreOnExit=true
